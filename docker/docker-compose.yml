# 应用栈：API / Celery Worker / Beat / MCP Runner / 前端
# 前置：先启动基础设施（含 Flower）
#   docker compose -f docker-compose.infra.yml up -d
# 启动：
#   docker compose up -d --build
# 全量构建启动：
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml up -d --build
#
# 环境变量优先从 .env 读取；未定义时回退 Docker 内部服务名（见 ${VAR:-default}）。

name: milesai-app

services:
  api:
    build:
      context: ..
      dockerfile: docker/images/api/Dockerfile
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-api:latest
    container_name: milesai-api
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-minio:9000}
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-milvus}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MCP_RUNNER_ENABLED: ${MCP_RUNNER_ENABLED:-true}
      MCP_RUNNER_URL: http://mcp-runner:8090
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-dev-runner-token-change-me}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - milesai-net
    volumes:
      - ../backend:/app/backend:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/images/worker/Dockerfile
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-worker:latest
    container_name: milesai-worker
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-minio:9000}
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-milvus}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    networks:
      - milesai-net
    command: celery -A app.workers.app worker -l info -Q default,parse,ocr,asr,embed
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: docker/images/worker/Dockerfile
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-worker:latest
    container_name: milesai-beat
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-minio:9000}
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-milvus}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    networks:
      - milesai-net
    command: celery -A app.workers.app beat -l info
    depends_on:
      - worker
    restart: unless-stopped

  mcp-runner:
    build:
      context: ..
      dockerfile: docker/images/mcp-runner/Dockerfile
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-mcp-runner:latest
    container_name: milesai-mcp-runner
    environment:
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-dev-runner-token-change-me}
      MCP_RUNNER_MAX_CONCURRENT: ${MCP_RUNNER_MAX_CONCURRENT:-20}
      MCP_RUNNER_WORK_DIR: /tmp
    networks:
      - milesai-net
    read_only: true
    tmpfs:
      - /tmp:size=512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/images/web/Dockerfile
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-web:latest
    container_name: milesai-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - milesai-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ..
      dockerfile: docker/images/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:8000/api/admin/v1}
        NEXT_PUBLIC_TENANT_WEB_URL: ${NEXT_PUBLIC_TENANT_WEB_URL:-http://localhost:3000}
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-admin-web:latest
    container_name: milesai-admin-web
    ports:
      - "${ADMIN_WEB_PORT:-3001}:80"
    networks:
      - milesai-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  milesai-net:
    external: true
    name: milesai-net
