server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # 路径重写（原 next.config.mjs redirects，静态导出后由 nginx 处理）
    rewrite ^/agents$          /workbench/agents          last;
    rewrite ^/agents/chat$     /workbench/agents/chat     last;
    rewrite ^/compliance$      /workbench/compliance      last;
    rewrite ^/prompts$         /workbench/prompts         last;
    rewrite ^/models$          /workbench/models          last;
    rewrite ^/hooks$           /workbench/hooks           last;
    rewrite ^/tools$           /workbench/tools           last;
    rewrite ^/skills$          /workbench/skills          last;
    rewrite ^/mcp$             /workbench/mcp             last;
    rewrite ^/kb$              /workbench/kb              last;
    rewrite ^/kb/(.*)$         /workbench/kb/$1           last;
    rewrite ^/attachments$     /workbench/attachments     last;
    rewrite ^/flows$           /workbench/flows           last;
    rewrite ^/flows/(.*)/edit$ /workbench/flows/$1/edit   last;
    rewrite ^/tasks$           /workbench/tasks           last;
    rewrite ^/monitor$         /workbench/monitor         last;
    rewrite ^/marketplace$     /workbench/marketplace     last;
    rewrite ^/sensitive-words$ /workbench/compliance      last;

    # SPA 回退：非静态文件请求都返回 index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 静态资源缓存
    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
