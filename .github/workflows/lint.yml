name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install backend (uv workspace)
        run: uv sync --all-packages --group dev
      - name: Ruff format check
        run: uv run --all-packages --group dev ruff format --check .
      - name: Ruff lint
        run: uv run --all-packages --group dev ruff check .
      - name: Package layering guard（import-linter）
        run: uv run --all-packages --group dev lint-imports
      - name: OpenAPI snapshot check
        run: uv run --all-packages --group dev python -m miles_server.scripts.export_openapi --check
      - name: Backend tests
        run: uv run --all-packages --group dev python -m pytest -q

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/workbench/package-lock.json
      - name: Install ui-shared
        working-directory: ui/shared
        run: npm ci
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - name: Install ui-shared
        working-directory: ui/shared
        run: npm ci
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
