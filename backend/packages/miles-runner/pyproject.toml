[project]
name = "miles-runner"
version = "0.1.0"
description = "独立 runner 服务（执行网关）"
requires-python = ">=3.11"
dependencies = [
    "miles-exec",
    "miles-common",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miles_runner"]

[tool.uv.sources]
miles-exec = { workspace = true }
miles-common = { workspace = true }
