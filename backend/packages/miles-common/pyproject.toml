[project]
name = "miles-common"
version = "0.1.0"
description = "通用基础能力（配置、日志、异常与共享工具）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "croniter>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miles_common"]
