[project]
name = "miles-admin"
version = "0.1.0"
description = "管理后台域（运营与租户管理接口）"
requires-python = ">=3.11"
dependencies = [
    "miles-portal",
    "miles-core",
    "miles-common",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "python-jose[cryptography]>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miles_admin"]

[tool.uv.sources]
miles-portal = { workspace = true }
miles-core = { workspace = true }
miles-common = { workspace = true }
