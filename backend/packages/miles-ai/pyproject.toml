[project]
name = "miles-ai"
version = "0.1.0"
description = "AI 能力域（Agent、RAG、模型与文档解析）"
requires-python = ">=3.11"
dependencies = [
    "miles-core",
    "miles-common",
    "miles-integrations",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.2.0",
    "pydantic>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "Pillow>=10.0.0",
    # packages/miles-ai/.../rag/parse/backends/pypdf.py 用 langchain_community.PyPDFLoader
    "pypdf>=5.1.0",
    "docling>=2.0.0",
    "pytesseract>=0.3.10",
    "openai-whisper>=20231117",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miles_ai"]

[tool.uv.sources]
miles-core = { workspace = true }
miles-common = { workspace = true }
miles-integrations = { workspace = true }
