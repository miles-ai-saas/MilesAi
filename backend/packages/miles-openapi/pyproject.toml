[project]
name = "miles-openapi"
version = "0.1.0"
description = "对外 OpenAPI 路由聚合与 schema 导出"
requires-python = ">=3.11"
dependencies = [
    "miles-portal",
    "miles-ai",
    "miles-core",
    "miles-common",
    "fastapi>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miles_openapi"]

[tool.uv.sources]
miles-portal = { workspace = true }
miles-ai = { workspace = true }
miles-core = { workspace = true }
miles-common = { workspace = true }
