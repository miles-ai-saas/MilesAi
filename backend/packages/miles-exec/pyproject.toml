[project]
name = "miles-exec"
version = "0.1.0"
description = "执行运行时（沙箱、MCP 与工具执行）"
requires-python = ">=3.11"
dependencies = [
    "miles-common",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miles_exec"]

[tool.uv.sources]
miles-common = { workspace = true }
