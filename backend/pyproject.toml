[project]
name = "milesai-workspace"
version = "0.1.0"
description = "一体化AI智能编排与RAG应用平台（多包工作区根）"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.13",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 160
target-version = "py311"
# `.data`（技能运行期数据）与 import-linter 缓存非源码，不纳入 lint。
# 用 extend-exclude 而非 exclude，以保留 ruff 默认排除项（.venv / node_modules 等）。
extend-exclude = [".data", ".import_linter_cache"]

[tool.ruff.lint]
# 核验规则集：`ruff check --show-settings . | sed -n '/^linter.rules.enabled/,/^\]/p'`
# 解析后共启用 188 条（E18 / F43 / I2 / B39 / UP44 / RUF42）。
# 注意 `select` 是**替换**默认集而非在其上叠加：ruff 默认只有 E4/E7/E9/F，
# 此处另纳入 E101、E501 与 import 排序(I)、bugbear(B)、pyupgrade(UP)、RUF，
# 让 `make lint-backend` 能拦住制表符混用、行宽、导入顺序、过时写法与常见陷阱。
#
# ARG（未使用参数）经评估不启用：实测 399 处
# （ARG001 284 / ARG002 41 / ARG005 74；`ruff check --select ARG --statistics .`）
# 其中 351 处（88%）落在 tests/（pytest fixture 与契约桩），生产侧仅 48 处，
# 且已逐处核对，全属接口契约或有意忽略：FastAPI 注入的 ctx（26 处）、
# LangGraph/AST/回调签名（state、config、node、run_manager、stop 等）、
# handler 统一协议（bound_skill_ids、actor_user_id）、工具 schema 占位壳（kwargs），
# 以及文档已注明忽略入参的适配器（precomputed 向量、IP 全掩、示例钩子等）。
# 噪声主要来自 tests/，启用即须写 per-file-ignores 逐块豁免，收益不抵成本，故不启用。
# 借该线索找出的真缺陷（函数签名声明却静默丢弃的参数）已逐一移除。
select = ["E", "F", "I", "B", "UP", "RUF"]
# UP042 已于 2026-09-16 迁移完毕（32 处 (str, Enum) → StrEnum），故不再忽略。
# 留档：当初以「影响落库语义」为由忽略是**说反了**——这些列一律以 values_callable
# 取 .value，json.dumps、== 与 SQLAlchemy 的 .enums/绑定/读回实测均不受影响；
# 唯一变化是 str()/f-string/format() 由 "Class.MEMBER" 变为成员值本身。
# 契约见 tests/models/test_enum_contract.py。
ignore = [
    # 中文注释 / 文案中的全角标点（，。：；「」等）非缺陷
    "RUF001",
    "RUF002",
    "RUF003",
    # 已登记技术债，留待后续批次逐处判断
    "RUF005",  # collection-literal-concatenation：集合字面量拼接
    "RUF012",  # mutable-class-default：类属性可变默认值（需配 ClassVar）
    # 保留本批未启用规则（以 ANN001 为主，另有 ARG 等）在 `# noqa` 中的说明作用。
    # 注意 `miles_server/registry.py` 不可照此逐条清理：该副作用导入块 21 条
    # `# noqa: F401` 中仅 3 条真正承载抑制（F401 只对同一根模块的最后一次绑定触发），
    # 其余记录「有意导入」，删掉会让该块只剩零星 3 行带注解、形似遗漏。
    "RUF100",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：Depends / Query 等作为默认参数值是官方推荐写法，不按 B008 报错。
# 注意 B008 会递归检查 `Depends(...)` 参数内部，故项目内的依赖工厂也须一并豁免。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    # 项目内权限依赖工厂（miles_core.deps / miles_admin.app_sys.deps）
    "miles_core.deps.require_permissions",
    "miles_core.deps.require_superuser",
    "miles_admin.app_sys.deps.require_admin_role",
]

[tool.ruff.lint.isort]
# 显式声明 first-party，避免 ruff 把 miles_* 与第三方混排（与现有分组风格一致）
known-first-party = [
    "miles_common",
    "miles_exec",
    "miles_core",
    "miles_ai",
    "miles_portal",
    "miles_admin",
    "miles_openapi",
    "miles_server",
    "miles_worker",
    "miles_runner",
]

[tool.ruff.lint.per-file-ignores]
# 迁移版本文件是**冻结的历史记录**，不改写其内容（与 README 对 alembic 版本脚本的豁免口径一致）。
# alembic 生成的模板本身即使用 typing.Union，故 UP035/UP007 在此目录整体豁免。
"alembic/versions/*.py" = ["UP035", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
