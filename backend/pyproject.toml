[project]
name = "milesai-workspace"
version = "0.1.0"
description = "一体化AI智能编排与RAG应用平台（多包工作区根）"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.13",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
