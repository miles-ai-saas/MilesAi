# 从项目根目录执行迁移时使用本配置：
#   cd /path/to/MilesAi && backend/.venv/bin/python -m alembic -c alembic.ini upgrade head
#
# 推荐仍在 backend 目录执行：
#   cd backend && alembic upgrade head

[alembic]
script_location = backend/alembic
prepend_sys_path = backend
version_path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
