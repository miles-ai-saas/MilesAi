# 应用栈：API / Celery Worker / Beat / MCP Runner
# 基础设施（PG/Redis/MinIO/Milvus）为独立集群，不在本 Compose 管理。
# 启动前确保 .env 中已配置外部基础设施地址（POSTGRES_HOST、REDIS_HOST 等）。
#
# 启动：
#   docker compose up -d --build
# 开发（挂载本地代码热重载）：
#   docker compose --profile dev up -d --build
#
# 前端已部署到 OSS，不在此处管理。
# 环境变量优先从 .env 读取；未定义时回退 localhost（本机开发默认值）。

name: milesai-app

# 后端共享环境变量（默认值假设基础设施在本机 / localhost）
x-backend-env: &backend-env
  POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
  REDIS_HOST: ${REDIS_HOST:-localhost}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-localhost:9000}
  VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-milvus}
  MILVUS_URI: ${MILVUS_URI:-http://localhost:19530}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://localhost:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://localhost:6379/2}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-api:latest
    container_name: milesai-api
    env_file:
      - .env
    environment:
      <<: *backend-env
      MCP_RUNNER_ENABLED: ${MCP_RUNNER_ENABLED:-true}
      MCP_RUNNER_URL: ${MCP_RUNNER_URL:-http://localhost:8090}
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-dev-runner-token-change-me}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend:ro
    profiles:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-worker:latest
    container_name: milesai-worker
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: celery -A app.workers.app worker -l info -Q default,parse,ocr,asr,embed
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-worker:latest
    container_name: milesai-beat
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: celery -A app.workers.app beat -l info
    restart: unless-stopped

  mcp-runner:
    build:
      context: .
      dockerfile: Dockerfile.mcp-runner
    image: registry.cn-shenzhen.aliyuncs.com/kye_secure/milesai-mcp-runner:latest
    container_name: milesai-mcp-runner
    environment:
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-dev-runner-token-change-me}
      MCP_RUNNER_MAX_CONCURRENT: ${MCP_RUNNER_MAX_CONCURRENT:-20}
      MCP_RUNNER_WORK_DIR: /tmp
    ports:
      - "8090:8090"
    read_only: true
    tmpfs:
      - /tmp:size=512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
